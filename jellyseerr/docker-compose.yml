services:
  jellyseerr:
    image: ghcr.io/fallenbagel/jellyseerr:2.7.3
    init: true
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=Europe/Madrid
      - PORT=5055 #optional
    volumes:
      - ./config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    ports:
      - 5055:5055
    networks:
      - vpn
    restart: unless-stopped

networks:
  vpn:
    external: true
