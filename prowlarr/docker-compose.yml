services:

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.3.0
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - ./config:/config
    ports:
      - 9696:9696
    networks:
      - media-tube-net
    restart: unless-stopped

networks:
  media-tube-net:
    external: true
