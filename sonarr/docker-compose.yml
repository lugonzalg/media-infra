services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.16
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - ./config:/config
      - /Users/lukas/mnt/gdrive/media:/data
      - ../qbittorrent/downloads:/downloads
    network_mode: container:gluetun
    restart: unless-stopped
